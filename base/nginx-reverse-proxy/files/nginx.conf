worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    # Logging is helpful for debugging the handshake
    log_format proxy '$remote_addr [$time_local] $protocol $status '
                     '$bytes_sent $bytes_received $session_time '
                     'upstream: "$upstream_addr" '
                     'ssl_preread: "$ssl_preread_server_name"';

    upstream ldap_backend {
        server ldap.corp.internal:636;
    }

    server {
        listen 1636 ssl;
        access_log /var/log/nginx/access.log proxy;

        # modern ciphers for Pinniped
        ssl_certificate     /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;

        # legacy ciphers for the backend OpenLDAP server
        proxy_pass           ldap_backend;
        proxy_ssl            on;
        proxy_ssl_verify     on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ldap-server-ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name ldap.corp.internal;
        proxy_ssl_protocols  TLSv1.2;
        proxy_ssl_ciphers    AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256;

        # tuning parameters
        proxy_ssl_session_reuse on;
        proxy_connect_timeout   5s;
        proxy_timeout           30s;
        ssl_handshake_timeout   10s;
    }
}
